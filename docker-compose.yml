version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    image: newsea-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - INIT_IN_BACKGROUND=true
  worker:
    image: newsea-backend:latest
    depends_on:
      - api
    env_file:
      - .env
    command: ["python", "-m", "backend.scraper.run_job", "--test"]
