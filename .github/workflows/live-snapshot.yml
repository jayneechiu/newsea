name: Refresh live Reddit snapshot

# Every two days: fetch hot Reddit threads, write bilingual cards with one OpenAI call each,
# store live-cards.json on the separate `live-data` branch, then redeploy Pages.
# Every two days (not hourly) keeps OpenAI tokens and Reddit API calls tiny; see README "Live data".
on:
  schedule:
    - cron: "17 13 */2 * *"
  workflow_dispatch:

permissions:
  contents: write # commit snapshots to the live-data branch
  actions: write # trigger pages.yml

concurrency:
  group: live-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'jayneechiu/newsea'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live in this protected environment; limit its deployment branches to the default branch.
    environment: content-refresh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        run: pip install praw requests python-dotenv

      - name: Build snapshot
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: "web:newsea-live-snapshot:v1 (by /u/newsea-demo)"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          TARGET_SUBREDDITS: AskReddit,todayilearned,LifeProTips,Dallas
          POSTS_LIMIT: "4"
        run: python -m backend.scraper.build_live_snapshot --out live-data/live-cards.json --limit 12

      - name: Publish to live-data branch
        working-directory: live-data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b live-data "$RUNNER_TEMP/live-data"
          cd "$RUNNER_TEMP/live-data"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          remote_head="$(git ls-remote --heads origin refs/heads/live-data)"
          if [ -n "$remote_head" ]; then
            git fetch -q --depth 1 origin live-data
            git checkout -q --detach FETCH_HEAD
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          cp "$GITHUB_WORKSPACE/live-data/live-cards.json" live-cards.json
          git add live-cards.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; keeping the current commit."
          else
            git commit -q -m "Live snapshot $(date -u +%F)"
            git push -q origin HEAD:refs/heads/live-data
          fi

      - name: Redeploy Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
