name: Deploy static demo to GitHub Pages

# One Pages site per repo, so every run builds both branches:
#   main -> https://jayneechiu.github.io/newsea/
#   dev  -> https://jayneechiu.github.io/newsea/dev/
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Fetch live Reddit snapshot (optional)
        run: |
          if git -C dev fetch -q --depth 1 origin live-data; then
            git -C dev show FETCH_HEAD:live-cards.json > live-cards.json
          else
            echo "No live-data branch yet; the Live lane stays hidden."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main/ui/package-lock.json
            dev/ui/package-lock.json

      - name: Build dev demo
        working-directory: dev/ui
        env:
          DEMO_BASE: /newsea/dev/
        run: |
          npm ci
          npm run build:demo

      - name: Build main demo
        id: main
        working-directory: main
        run: |
          if [ -f ui/package.json ] && grep -q '"build:demo"' ui/package.json; then
            cd ui
            npm ci
            npm run build:demo
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has no build:demo script yet; /newsea/ will redirect to /newsea/dev/."
          fi

      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp -r dev/ui/dist/. site/dev/
          if [ "${{ steps.main.outputs.built }}" = "true" ]; then
            cp -r main/ui/dist/. site/
          else
            echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=dev/">' > site/index.html
          fi
          # Pages only honours the top-level 404.html; it routes deep links to main or /dev/.
          cp dev/ui/dist/404.html site/404.html
          if [ -f live-cards.json ]; then
            mkdir -p site/live site/dev/live
            cp live-cards.json site/live/
            cp live-cards.json site/dev/live/
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
