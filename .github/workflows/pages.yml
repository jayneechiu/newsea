name: Deploy static demo to GitHub Pages

# Single demo built from dev (the default branch): https://jayneechiu.github.io/newsea/
# Old /newsea/dev/ links are redirected by demo-404.html.
on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Fetch live Reddit snapshot (optional)
        run: |
          if git fetch -q --depth 1 origin live-data; then
            mkdir -p ui/public/live
            git show FETCH_HEAD:live-cards.json > ui/public/live/live-cards.json
          else
            echo "No live-data branch yet; the Live lane stays hidden."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build demo
        working-directory: ui
        run: |
          npm ci
          npm run build:demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4